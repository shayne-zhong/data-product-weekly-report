<!doctype html>
<!--
  原型说明：本文件仅为管理后台评审原型，不连接真实接口，也不代表生产状态。
  假设：桌面端由全局管理员与部门负责人使用；示例记录仅用于演示权限、审计和异常处置流程。
  尚未解决：真实权限校验、保存持久化、审批链及任务补跑的服务端幂等校验需由生产系统实现。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>部门工作台 · 制度化运营台（原型）</title>
  <style>
    :root { --red:#bd3029; --red-dark:#8f201c; --ink:#202321; --muted:#656b67; --line:#d9dcda; --soft:#f4f5f3; --paper:#fff; --warn:#956713; --bad:#aa3029; --good:#2d6f4b; --run:#466e9d; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); background:#eceeeb; font:14px/1.5 "Microsoft YaHei UI","Noto Sans CJK SC","PingFang SC",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #1d6d9e; outline-offset:2px; }
    .app { min-height:100vh; }
    .utility { height:36px; display:flex; justify-content:space-between; align-items:center; padding:0 max(24px,calc((100vw - 1376px)/2)); background:#242825; color:#e7ebe7; font-size:12px; letter-spacing:.02em; }
    .utility strong { color:#fff; font-weight:600; }
    .shell { max-width:1424px; margin:auto; background:var(--paper); min-height:924px; border-inline:1px solid #cfd3d0; }
    .masthead { display:flex; min-height:84px; align-items:center; justify-content:space-between; gap:24px; padding:0 24px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; min-width:260px; }
    .brandmark { position:relative; width:36px; height:36px; border:3px solid var(--red); display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:4px; }
    .brandmark i { display:block; background:var(--red); } .brandmark i:nth-child(2){opacity:.72}.brandmark i:nth-child(3){opacity:.43}.brandmark i:nth-child(4){background:transparent;border:1px solid var(--red)}
    .brand-name { font-size:18px; font-weight:700; letter-spacing:.04em; } .brand-sub { color:var(--muted); font-size:12px; }
    .roles { display:flex; align-items:center; gap:10px; }
    .roles-label { color:var(--muted); font-size:12px; }
    .role-switch { display:flex; padding:3px; background:var(--soft); border:1px solid var(--line); border-radius:2px; }
    .role-switch button { min-height:38px; border:0; background:transparent; padding:0 13px; color:var(--muted); font-weight:600; }
    .role-switch button.active { background:var(--ink); color:#fff; }
    .primary { display:flex; align-items:stretch; min-height:54px; padding:0 24px; border-bottom:1px solid var(--line); overflow-x:auto; }
    .primary button { position:relative; min-width:144px; padding:0 16px; border:0; border-right:1px solid var(--line); background:#fff; color:#454a46; text-align:left; font-weight:700; }
    .primary button:first-child { border-left:1px solid var(--line); }
    .primary button.active { color:var(--red); background:#fbfbfa; }
    .primary button.active::after { content:""; position:absolute; inset:auto 0 0; height:4px; background:var(--red); }
    .primary .access-note { margin-left:auto; align-self:center; padding-left:18px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .secondary { display:flex; align-items:center; gap:4px; min-height:48px; padding:0 24px; background:#f8f9f7; border-bottom:1px solid var(--line); overflow-x:auto; }
    .secondary button { min-height:38px; border:1px solid transparent; background:transparent; color:#535954; padding:0 12px; white-space:nowrap; }
    .secondary button.active { background:#fff; border-color:var(--line); color:var(--ink); font-weight:700; box-shadow:inset 0 -2px 0 var(--red); }
    .dirty-dot { display:inline-block; width:7px; height:7px; margin-left:7px; border-radius:50%; background:var(--red); vertical-align:middle; }
    main { padding:26px 24px 104px; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; padding-bottom:18px; border-bottom:3px solid var(--ink); }
    .eyebrow { margin:0 0 5px; color:var(--red); font-size:12px; font-weight:700; letter-spacing:.12em; }
    h1 { margin:0; font-size:28px; line-height:1.2; letter-spacing:-.04em; } .lede { margin:8px 0 0; color:var(--muted); }
    .stamp { max-width:310px; border-left:3px solid var(--red); padding-left:10px; color:#4e544f; font-size:12px; }
    .action { min-height:44px; border:1px solid var(--ink); padding:0 15px; background:var(--ink); color:#fff; font-weight:700; }
    .action:hover { background:#3b413d; }.action.secondary-action { background:#fff;color:var(--ink);border-color:#9da39e; }.action.danger { background:var(--red);border-color:var(--red); }
    .notice { display:flex; gap:12px; margin:22px 0; padding:13px 14px; border:1px solid #d9c89b; border-left:5px solid var(--warn); background:#fffaf0; }
    .notice strong { white-space:nowrap; }.notice p { margin:0; color:#5b5037; }
    .ops-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:20px; margin-top:22px; }
    .panel { border:1px solid var(--line); background:#fff; }.panel-head { display:flex; justify-content:space-between; align-items:baseline; padding:14px 16px; border-bottom:1px solid var(--line); }.panel-head h2 { margin:0; font-size:16px; }.panel-head span { color:var(--muted);font-size:12px; }
    .issue { display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }.issue:last-child{border-bottom:0}.issue-mark { width:22px;height:22px;border:1px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:800; }.issue.failure{color:var(--bad)}.issue.warning{color:var(--warn)}.issue.neutral{color:#4e6456}.issue-title{color:var(--ink);font-weight:700}.issue-meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}.plain-link{border:0;background:none;color:var(--red-dark);font-weight:700;text-decoration:underline;text-underline-offset:3px;}
    .metric-grid { display:grid; grid-template-columns:1fr 1fr; }.metric { min-height:120px; padding:16px; border-right:1px solid var(--line);border-bottom:1px solid var(--line); }.metric:nth-child(even){border-right:0}.metric:nth-last-child(-n+2){border-bottom:0}.metric-label{color:var(--muted);font-size:12px}.metric-num{margin-top:12px;font-size:32px;font-weight:700;letter-spacing:-.05em}.metric-desc{color:#555b56;font-size:12px}
    .audit { margin-top:20px; border-top:2px solid var(--ink); }.audit-row{display:grid;grid-template-columns:160px 1fr 176px;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.audit-row time,.muted{color:var(--muted)}
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin:20px 0 12px; }.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap}.filter{height:40px;padding:0 10px;border:1px solid var(--line);background:#fff;color:#3d423e}.filter input{border:0;outline:0;width:170px;}
    .table-wrap{overflow:auto;border:1px solid var(--line)} table{width:100%;border-collapse:collapse;min-width:900px;text-align:left} th{padding:11px 12px;background:#f3f5f2;border-bottom:2px solid var(--ink);color:#4a504b;font-size:12px;letter-spacing:.04em}td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbf9}.record-btn{border:0;background:transparent;padding:0;color:var(--ink);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px}.badge{display:inline-flex;align-items:center;min-height:24px;border:1px solid currentColor;padding:1px 7px;font-size:12px;font-weight:700;white-space:nowrap}.badge.good{color:var(--good);background:#f3faf5}.badge.warn{color:var(--warn);background:#fffaf0}.badge.bad{color:var(--bad);background:#fff6f5}.badge.run{color:var(--run);background:#f4f8fc}.badge.none{color:#69706a;background:#f5f6f4}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:22px}.form-section{border-top:3px solid var(--ink);padding-top:13px}.form-section h2{margin:0;font-size:17px}.form-section p{margin:5px 0 14px;color:var(--muted);font-size:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field small{display:block;color:var(--muted);margin-top:4px}.input{height:44px;width:100%;border:1px solid #aeb4af;background:#fff;padding:0 10px}.checkline{display:flex;align-items:center;gap:9px;min-height:44px;border-bottom:1px solid var(--line)}.checkline input{width:18px;height:18px;accent-color:var(--red)}
    .runbook{margin-top:22px;border-top:3px solid var(--ink)}.run-row{display:grid;grid-template-columns:240px 112px 1fr 130px;gap:14px;align-items:start;padding:14px 12px;border-bottom:1px solid var(--line)}.run-name{font-weight:700}.run-detail{color:#505651;font-size:12px}.run-detail strong{color:var(--ink)}
    .savebar{position:fixed;z-index:20;right:24px;bottom:20px;left:24px;display:none;max-width:1376px;margin:auto;padding:12px 14px;border:1px solid var(--ink);border-left:6px solid var(--red);background:#fff;box-shadow:0 10px 28px rgba(23,29,25,.18);align-items:center;justify-content:space-between;gap:16px}.savebar.visible{display:flex}.savebar p{margin:0}.savebar-actions{display:flex;gap:8px;white-space:nowrap}
    .scrim{position:fixed;z-index:30;inset:0;background:rgba(29,34,30,.42);display:none}.scrim.visible{display:block}.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-12px 0 34px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s ease;padding:22px;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;gap:18px;padding-bottom:18px;border-bottom:3px solid var(--ink)}.drawer h2{margin:0;font-size:23px}.icon-button{width:44px;height:44px;border:1px solid var(--line);background:#fff;font-size:22px}.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:0;margin:18px 0;border-top:1px solid var(--line)}.detail-grid dt,.detail-grid dd{margin:0;padding:11px 0;border-bottom:1px solid var(--line)}.detail-grid dt{color:var(--muted)}.drawer-foot{display:flex;gap:9px;margin-top:24px}
    .modal{position:fixed;z-index:50;inset:0;display:none;place-items:center;padding:20px}.modal.visible{display:grid}.modal-card{width:min(560px,100%);background:#fff;border:1px solid var(--ink);box-shadow:0 18px 48px rgba(0,0,0,.28)}.modal-head{padding:18px 20px;border-bottom:3px solid var(--red)}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:18px 20px}.modal-body p{margin:0 0 12px}.modal-body ul{margin:8px 0;padding-left:20px;color:#4b514c}.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:#fafbf9}
    .toast{position:fixed;z-index:70;right:24px;top:48px;transform:translateY(-160%);background:#263e30;color:#fff;padding:12px 15px;border-left:4px solid #66a178;box-shadow:0 8px 20px rgba(0,0,0,.18);transition:transform .2s}.toast.show{transform:translateY(0)}
    @media (max-width:760px){.utility{padding:0 14px}.shell{min-height:100vh}.masthead{padding:12px 14px;align-items:flex-start;flex-direction:column}.primary,.secondary,main{padding-inline:14px}.primary .access-note{display:none}.ops-grid,.form-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.audit-row{grid-template-columns:1fr}.run-row{grid-template-columns:1fr}.savebar{left:10px;right:10px;bottom:10px;align-items:flex-start;flex-direction:column}.savebar-actions{width:100%}.savebar-actions button{flex:1}.stamp{max-width:none}}
  </style>
</head>
<body>
  <div class="app">
    <div class="utility"><span><strong>评审原型</strong> · 示例数据 · 不连接生产服务</span><span id="utilityRole">当前演示：全局管理员</span></div>
    <div class="shell">
      <header class="masthead">
        <div class="brand" aria-label="部门工作台">
          <span class="brandmark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div><div class="brand-name">部门工作台</div><div class="brand-sub">管理后台 / 制度化运营台</div></div>
        </div>
        <div class="roles" aria-label="演示角色切换"><span class="roles-label">演示权限</span><div class="role-switch"><button class="active" data-role="admin">全局管理员</button><button data-role="leader">部门负责人</button></div></div>
      </header>
      <nav class="primary" id="primaryNav" aria-label="一级导航"></nav>
      <nav class="secondary" id="secondaryNav" aria-label="二级导航"></nav>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="savebar" id="savebar" role="status"><p><strong>有未保存的更改</strong><br><span class="muted">配置将仅在确认保存后生效；真实环境仍需服务端权限校验。</span></p><div class="savebar-actions"><button class="action secondary-action" id="discardBtn">放弃更改</button><button class="action" id="saveBtn">保存配置</button></div></div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-modal="true" aria-label="详情面板" role="dialog"></aside>
  <section class="modal" id="modal" aria-modal="true" aria-labelledby="modalTitle" role="dialog"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const groups = {
        organisation: { label:'组织管理', pages:[['overview','管理概览'],['departments','部门管理'],['members','成员管理']] },
        rules: { label:'规则配置', pages:[['settings','保持登录'],['archive','归档设置']] },
        systems: { label:'系统运维', pages:[['keys','API 密钥'],['operations','定时任务']] }
      };
      const state = { role:'admin', group:'organisation', page:'overview', dirty:false, drawerOpen:false, modalOpen:false };
      const $ = (s) => document.querySelector(s);
      const primary = $('#primaryNav'), secondary = $('#secondaryNav'), main = $('#main');
      const allowedGroups = () => state.role === 'admin' ? Object.keys(groups) : ['organisation'];
      const allowedPages = () => state.role === 'admin' ? groups[state.group].pages : groups.organisation.pages.filter(([id]) => id !== 'overview');
      function escapeText(value) { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; }
      function updateNav() {
        if (!allowedGroups().includes(state.group)) { state.group = 'organisation'; state.page = 'departments'; }
        primary.innerHTML = allowedGroups().map(id => `<button type="button" data-group="${id}" class="${state.group === id ? 'active' : ''}" aria-current="${state.group === id ? 'page' : 'false'}">${groups[id].label}</button>`).join('') + `<span class="access-note">${state.role === 'admin' ? '可见全部管理范围' : '仅可维护本部门允许内容'}</span>`;
        secondary.innerHTML = allowedPages().map(([id,label]) => `<button type="button" data-page="${id}" class="${state.page === id ? 'active' : ''}">${label}${state.dirty && ['settings','archive','keys'].includes(id) ? '<span class="dirty-dot" title="有未保存更改"></span>' : ''}</button>`).join('');
      }
      function status(type, label) { return `<span class="badge ${type}">${label}</span>`; }
      function overview() { return `
        <div class="page-head"><div><p class="eyebrow">管理概览 / 处理队列</p><h1>先处理会影响制度执行的事项</h1><p class="lede">以下均为示例数据。按风险与可追溯性排序，不以装饰性指标替代处置线索。</p></div><div class="stamp">状态登记：2026-09-03 09:20<br>数据范围：全部部门 / 最近 7 日</div></div>
        <section class="notice"><strong>需优先处置</strong><p>检测到 1 项定时任务失败。补跑前需确认它不会重复创建任务，也不会提前归档。</p></section>
        <div class="ops-grid"><section class="panel"><div class="panel-head"><h2>待处理事项</h2><span>5 项示例记录</span></div>
          <div class="issue failure"><span class="issue-mark">!</span><div><span class="issue-title">周任务结转未完成</span><span class="issue-meta">来源：Node 后台调度 · 研发部 · 2026-09-03 08:00</span></div><button class="plain-link" data-go="operations">查看并处置</button></div>
          <div class="issue warning"><span class="issue-mark">!</span><div><span class="issue-title">销售部缺少部门负责人</span><span class="issue-meta">组织管理 · 所有者解析无法建立有效责任边界</span></div><button class="plain-link" data-go="departments">查看部门</button></div>
          <div class="issue warning"><span class="issue-mark">!</span><div><span class="issue-title">2 名模块负责人未配置管理模块</span><span class="issue-meta">成员管理 · 权限范围需补全后才可生效</span></div><button class="plain-link" data-go="members">查看成员</button></div>
          <div class="issue neutral"><span class="issue-mark">→</span><div><span class="issue-title">3 份总结已到归档日，尚未归档</span><span class="issue-meta">归档设置 · 系统不会提前归档未来报告</span></div><button class="plain-link" data-go="archive">检查规则</button></div>
        </section><section class="panel"><div class="panel-head"><h2>控制面状态</h2><span>示例，不代表生产统计</span></div><div class="metric-grid"><div class="metric"><div class="metric-label">当前可见部门</div><div class="metric-num">06</div><div class="metric-desc">管理员范围</div></div><div class="metric"><div class="metric-label">需人工确认</div><div class="metric-num">05</div><div class="metric-desc">按风险排序</div></div><div class="metric"><div class="metric-label">运行失败</div><div class="metric-num">01</div><div class="metric-desc">待决定是否补跑</div></div><div class="metric"><div class="metric-label">未保存配置</div><div class="metric-num">${state.dirty ? '01' : '00'}</div><div class="metric-desc">页面级状态</div></div></div></section></div>
        <section class="audit"><div class="panel-head"><h2>最近可追溯记录</h2><span>示例审计摘要</span></div><div class="audit-row"><time>09:20 · 2026-09-03</time><span><strong>系统检查</strong> 记录“周任务结转”失败，范围为研发部。</span><span class="muted">来源：Node 后台调度</span></div><div class="audit-row"><time>17:42 · 2026-09-02</time><span><strong>全局管理员</strong> 更新了归档保留期限，等待保存确认。</span><span class="muted">来源：管理后台</span></div><div class="audit-row"><time>08:00 · 2026-09-02</time><span><strong>系统检查</strong> 确认“报告自动归档”已完成，未强制处理未来记录。</span><span class="muted">来源：Node 后台调度</span></div></section>`; }
      function departments() { return `
        <div class="page-head"><div><p class="eyebrow">组织管理 / 部门管理</p><h1>部门责任边界</h1><p class="lede">高密度列表仅呈现可判断的字段。点击部门查看受控详情。</p></div><button class="action" data-drawer="new-department">新增部门</button></div>
        <div class="toolbar"><div class="filters"><label class="filter">筛选：<select><option>全部状态</option><option>需补充负责人</option></select></label><label class="filter">搜索 <input placeholder="部门名称或负责人" /></label></div><span class="muted">示例数据 · 共 6 个部门</span></div>
        <div class="table-wrap"><table><thead><tr><th>部门</th><th>部门负责人</th><th>管理模块</th><th>成员</th><th>责任状态</th><th>最近调整</th></tr></thead><tbody>
          <tr><td><button class="record-btn" data-drawer="研发部">研发部</button></td><td>陈子安</td><td>产品研发、质量交付</td><td>42</td><td>${status('good','已配置')}</td><td>2026-08-25</td></tr>
          <tr><td><button class="record-btn" data-drawer="销售部">销售部</button></td><td>—</td><td>客户经营</td><td>31</td><td>${status('bad','缺少负责人')}</td><td>2026-08-21</td></tr>
          <tr><td><button class="record-btn" data-drawer="财务部">财务部</button></td><td>林思远</td><td>经营分析</td><td>18</td><td>${status('good','已配置')}</td><td>2026-08-19</td></tr>
          <tr><td><button class="record-btn" data-drawer="人力资源部">人力资源部</button></td><td>魏岚</td><td>组织发展</td><td>16</td><td>${status('good','已配置')}</td><td>2026-08-14</td></tr>
          <tr><td><button class="record-btn" data-drawer="供应链部">供应链部</button></td><td>周睿</td><td>采购协同</td><td>25</td><td>${status('warn','模块待确认')}</td><td>2026-08-12</td></tr>
        </tbody></table></div>`; }
      function members() { return `
        <div class="page-head"><div><p class="eyebrow">组织管理 / 成员管理</p><h1>成员与权限范围</h1><p class="lede">角色只表达允许的操作范围；真实系统仍由后端按部门及资源校验。</p></div><button class="action" data-drawer="new-member">新增成员</button></div>

      function settingPage(kind) { const archive = kind === 'archive'; const keys = kind === 'keys'; const title = keys ? 'API 密钥' : archive ? '归档设置' : '保持登录'; const eyebrow = keys ? '系统运维 / API 密钥' : `规则配置 / ${title}`; let body;
        if (keys) body = `<div class="form-grid"><section class="form-section"><h2>AI 服务凭证</h2><p>密钥仅显示掩码状态；无法在此原型或界面中查看原文。</p><div class="field"><label>当前状态</label><div class="input">已配置 · sk-••••••••••••7D2A</div><small>示例掩码，不是真实密钥。</small></div><button class="action secondary-action" data-dirty>更换密钥</button></section><section class="form-section"><h2>访问边界</h2><p>凭证更新是高风险操作，生产环境需二次确认与审计。</p><div class="checkline"><input type="checkbox" checked id="keyAudit" data-dirty><label for="keyAudit">记录管理端凭证变更审计</label></div><div class="checkline"><input type="checkbox" checked id="keyScope" data-dirty><label for="keyScope">限制为服务端运行时使用</label></div></section></div>`;
        else if (archive) body = `<div class="form-grid"><section class="form-section"><h2>自动归档条件</h2><p>只处理已到期报告；不会强制归档未来报告。</p><div class="field"><label for="archiveDays">到期后保留天数</label><input class="input" id="archiveDays" type="number" value="14" min="1" data-dirty><small>示例配置。变更后等待页面级保存。</small></div><div class="checkline"><input type="checkbox" checked id="archiveNotice" data-dirty><label for="archiveNotice">归档前保留审计记录</label></div></section><section class="form-section"><h2>人工复核</h2><p>自动规则之外的报告不应被任务补跑操作影响。</p><div class="checkline"><input type="checkbox" checked id="archiveGuard" data-dirty><label for="archiveGuard">阻止提前归档未来报告</label></div><div class="checkline"><input type="checkbox" id="archiveNotify" data-dirty><label for="archiveNotify">归档异常时通知全局管理员</label></div></section></div>`;

        return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="lede">分组表单与页面级保存状态，避免把未确认更改误认为已生效。</p></div><div class="stamp">配置来源：管理后台<br>示例状态：已读取，未连接服务</div></div>${body}`; }
      function operations() { return `<div class="page-head"><div><p class="eyebrow">系统运维 / 定时任务</p><h1>定时任务运行记录</h1><p class="lede">按每次执行记录来源、范围和业务结果。失败摘要经过脱敏处理。</p></div><button class="action danger" data-modal="rerun">检查并补跑</button></div>

        <div class="runbook"><div class="run-row" style="background:#f3f5f2;font-size:12px;font-weight:700"><span>任务 / 最近执行</span><span>状态</span><span>来源、范围与业务结果</span><span>操作</span></div>

          <div class="run-row"><div><div class="run-name">报告自动归档</div><div class="run-detail">2026-09-03 08:00</div></div><div>${status('good','成功')}</div><div class="run-detail"><strong>来源：</strong>Node 后台调度<br><strong>范围：</strong>全部部门 · 到期报告<br><strong>结果：</strong>已归档 3 份，未处理未来报告</div><button class="action secondary-action" data-drawer="archive-run">查看记录</button></div>
          <div class="run-row"><div><div class="run-name">配置巡检</div><div class="run-detail">2026-09-03 09:20</div></div><div>${status('run','执行中')}</div><div class="run-detail"><strong>来源：</strong>管理员手动发起<br><strong>范围：</strong>组织负责人、模块范围<br><strong>结果：</strong>已识别 2 项待处理配置</div><button class="action secondary-action" data-drawer="inspection">查看范围</button></div>
          <div class="run-row"><div><div class="run-name">历史任务负责人解析</div><div class="run-detail">—</div></div><div>${status('none','从未执行')}</div><div class="run-detail"><strong>来源：</strong>未配置启动条件<br><strong>范围：</strong>尚未建立<br><strong>结果：</strong>无执行记录</div><button class="action secondary-action" data-drawer="never-run">查看说明</button></div>
        </section>`; }
      function render() { updateNav(); const views = {overview,departments,members,settings:() => settingPage('settings'),archive:() => settingPage('archive'),keys:() => settingPage('keys'),operations}; main.innerHTML = views[state.page](); main.focus(); bindPage(); }
      function setDirty(value=true) { state.dirty=value; $('#savebar').classList.toggle('visible',value); updateNav(); }
      function bindPage() { document.querySelectorAll('[data-dirty]').forEach(el => el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'click', () => setDirty())); document.querySelectorAll('[data-drawer]').forEach(el => el.addEventListener('click', () => openDrawer(el.dataset.drawer))); document.querySelectorAll('[data-modal]').forEach(el => el.addEventListener('click', () => openModal(el.dataset.modal))); document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => navigate(el.dataset.go))); }
      function navigate(page) { for (const [group, def] of Object.entries(groups)) { if (def.pages.some(([id]) => id === page)) { state.group=group; state.page=page; render(); return; } } }
      function openDrawer(record) { state.drawerOpen=true; const details = { '销售部':['销售部','部门负责人','未配置','成员数量','31 名','风险提示','缺少部门负责人，无法建立部门级责任边界。','最近调整','2026-08-21'], '研发部':['研发部','部门负责人','陈子安','管理模块','产品研发、质量交付','成员数量','42 名','最近调整','2026-08-25'], '陈子安':['陈子安','所属部门','研发部','角色','部门负责人','允许范围','研发部全部任务与成员','状态','有效'], '杜明':['杜明','所属部门','销售部','角色','模块负责人','允许范围','未配置模块','状态','需补全'], 'archive-run':['报告自动归档','执行时间','2026-09-03 08:00','来源','Node 后台调度','范围','全部部门 / 到期报告','业务结果','已归档 3 份，未处理未来报告'], 'inspection':['配置巡检','执行状态','执行中','范围','组织负责人、模块范围','当前结果','已识别 2 项待处理配置','来源','管理员手动发起'], 'never-run':['历史任务负责人解析','执行状态','从未执行','启动条件','尚未配置','范围','尚未建立','业务结果','无执行记录'] };
        const item = details[record] || [record === 'new-member' ? '新增成员' : '新增部门','说明','此处为原型受控详情面板。','权限边界','真实服务端需再次校验。','审计','保存后才产生审计记录。'];
        let rows = ''; for(let i=1;i<item.length;i+=2) rows += `<dt>${escapeText(item[i])}</dt><dd>${escapeText(item[i+1])}</dd>`;
        $('#drawer').innerHTML = `<div class="drawer-head"><div><p class="eyebrow">受控详情 / 示例数据</p><h2>${escapeText(item[0])}</h2></div><button class="icon-button" data-close aria-label="关闭详情">×</button></div><dl class="detail-grid">${rows}</dl><div class="drawer-foot"><button class="action secondary-action" data-close>关闭</button><button class="action" data-dirty>标记为已编辑</button></div>`;
        $('#scrim').classList.add('visible'); $('#drawer').classList.add('open'); $('#drawer [data-close]').focus(); $('#drawer').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click',closeOverlays)); $('#drawer [data-dirty]').addEventListener('click',() => {setDirty(); closeOverlays(); showToast('已产生未保存更改');});
      }
      function openModal() { state.modalOpen=true; $('#modal').innerHTML = `<div class="modal-card"><div class="modal-head"><p class="eyebrow">高风险操作 / 需明确确认</p><h2 id="modalTitle">检查并补跑“周任务结转”</h2></div><div class="modal-body"><p>此操作先检查已有执行记录与目标周状态，再决定是否补跑。它不应重复创建任务，也不应提前归档任何报告。</p><ul><li>范围：研发部 · 2026-W36 → 2026-W37</li><li>来源：管理后台人工确认</li><li>真实环境须由服务端执行幂等与权限校验</li></ul></div><div class="modal-actions"><button class="action secondary-action" data-close>取消</button><button class="action danger" id="confirmRerun">确认检查并补跑</button></div></div>`; $('#scrim').classList.add('visible'); $('#modal').classList.add('visible'); $('#modal [data-close]').focus(); $('#modal [data-close]').addEventListener('click',closeOverlays); $('#confirmRerun').addEventListener('click', () => {closeOverlays();showToast('原型已记录确认；真实系统需提交服务端检查。');}); }
      function closeOverlays() { state.drawerOpen=state.modalOpen=false; $('#scrim').classList.remove('visible'); $('#drawer').classList.remove('open'); $('#modal').classList.remove('visible'); }
      let toastTimer; function showToast(message) { const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200); }
      primary.addEventListener('click', e => { const b=e.target.closest('[data-group]'); if(b){state.group=b.dataset.group; state.page=groups[state.group].pages[0][0]; render();} });
      primary.addEventListener('focusin', e => { const b=e.target.closest('[data-group]'); if(b && state.group!==b.dataset.group){state.group=b.dataset.group; state.page=groups[state.group].pages[0][0]; render();} });
      secondary.addEventListener('click', e => { const b=e.target.closest('[data-page]'); if(b){state.page=b.dataset.page;render();} });
      document.querySelectorAll('[data-role]').forEach(b => b.addEventListener('click', () => { state.role=b.dataset.role; document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b)); $('#utilityRole').textContent = `当前演示：${state.role === 'admin' ? '全局管理员' : '部门负责人（仅本部门）'}`; if(state.role==='leader'){state.group='organisation';state.page='departments';} render();showToast(state.role==='admin'?'已切换为全局管理员视图':'已切换为部门负责人视图'); }));
      $('#saveBtn').addEventListener('click',() => {setDirty(false);showToast('原型已模拟保存；未连接真实服务。');}); $('#discardBtn').addEventListener('click',() => {setDirty(false);render();showToast('已放弃原型中的未保存更改。');}); $('#scrim').addEventListener('click', closeOverlays);
      document.addEventListener('keydown', e => { if(e.key === 'Escape') { if(state.modalOpen || state.drawerOpen) closeOverlays(); else if(state.dirty) showToast('未保存更改仍保留；可保存或放弃。'); } });
